[theme]
base = "light"
primaryColor = "#24557a"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f1efe9"
textColor = "#1d1d1b"
borderColor = "#e2dfd6"
showWidgetBorder = true
baseRadius = "small"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
